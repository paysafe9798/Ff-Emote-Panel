<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Under Maintenance</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.box{
    padding:30px;
    max-width:500px;
}

h1{
    font-size:32px;
    margin-bottom:15px;
}

p{
    font-size:18px;
    color:#ccc;
}

.loader{
    width:50px;
    height:50px;
    border:5px solid #333;
    border-top:5px solid #fff;
    border-radius:50%;
    margin:25px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}
</style>
</head>
<body>

<div class="box">
    <h1>🚧 Website Under Maintenance</h1>
    <div class="loader"></div>
    <p>
        Website kuch time baad open ho jaye gi.<br>
        Abhi kuch errors aur updates chal rahi hain.
    </p>
</div>

</body>
</html>
